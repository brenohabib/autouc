{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Device Setup</title>
    <link rel="stylesheet" href="{% static 'index.css' %}">
</head>
<body>
    <form method="post" style="display: none;">
        {% csrf_token %}
    </form>
    <div class="page">
        <div class="device-card">
            <div class="device-visual">
                <div class="device-header">
                    <span class="device-name">TP-Link EX</span>
                    <span id="device-status-dot" class="status-dot status-offline"></span>
                </div>
                <div class="device-body">
                    <div class="device-shape">
                    </div>
                </div>
                <div class="device-footer">
                    <span class="status-label">Status:</span>
                    <span id="device-status-text" class="status-text">OFFLINE</span>
                </div>
            </div>
            <div class="device-actions">
                <button id="btn-update-firmware" class="action-button primary">Firmware</button>
                <button id="btn-use-preset" class="action-button secondary">Preset</button>
            </div>
        </div>
        <div style="height: 24px;"></div>
        <div class="device-card">
            <div class="device-visual">
                <div class="device-header">
                    <span class="device-name">Data</span>
                    <span id="data-status-dot" class="status-dot status-offline"></span>
                </div>
                <div class="device-body">
                    <div class="device-shape">
                    </div>
                </div>
                <div class="device-footer">
                    <span class="status-label">Status:</span>
                    <span id="data-status-text" class="status-text">OFFLINE</span>
                </div>
            </div>
            <div class="device-actions">
                <button id="btn-data-update-firmware" class="action-button primary">Firmware</button>
                <button id="btn-data-use-preset" class="action-button secondary">Preset</button>
            </div>
        </div>
    </div>
    <script>
        function getCookie(name) {
            const value = document.cookie;
            if (!value) return null;
            const parts = value.split(";");
            for (let i = 0; i < parts.length; i++) {
                const cookie = parts[i].trim();
                if (cookie.startsWith(name + "=")) {
                    return decodeURIComponent(cookie.substring(name.length + 1));
                }
            }
            return null;
        }

        function createDeviceController(options) {
            const statusDot = document.getElementById(options.statusDotId);
            const statusText = document.getElementById(options.statusTextId);
            const btnUpdateFirmware = document.getElementById(options.firmwareBtnId);
            const btnUsePreset = document.getElementById(options.presetBtnId);

            let busy = false;

            function setStatus(status) {
                const normalized = String(status || "").toUpperCase();
                statusText.textContent = normalized || "OFFLINE";
                statusDot.className = "status-dot status-" + (normalized || "offline").toLowerCase();
            }

            async function refreshStatus() {
                if (busy) {
                    return;
                }
                try {
                    const response = await fetch(options.statusUrl);
                    if (!response.ok) {
                        return;
                    }
                    const data = await response.json();
                    if (data && typeof data.status === "string") {
                        setStatus(data.status);
                    }
                } catch (e) {
                }
            }

            function setBusyState(state) {
                busy = state;
                btnUpdateFirmware.disabled = state;
                btnUsePreset.disabled = state;
            }

            async function callAction(url) {
                setBusyState(true);
                setStatus("UPDATING");
                const csrfToken = getCookie("csrftoken");
                const headers = {};
                if (csrfToken) {
                    headers["X-CSRFToken"] = csrfToken;
                }
                try {
                    const response = await fetch(url, {
                        method: "POST",
                        headers: headers,
                    });
                    if (!response.ok) {
                        setStatus("FAILED");
                        return;
                    }
                    setStatus("ONLINE");
                } catch (e) {
                    setStatus("FAILED");
                } finally {
                    setBusyState(false);
                }
            }

            btnUpdateFirmware.addEventListener("click", function (event) {
                event.preventDefault();
                callAction(options.firmwareUrl);
            });

            btnUsePreset.addEventListener("click", function (event) {
                event.preventDefault();
                callAction(options.presetUrl);
            });

            refreshStatus();
            setInterval(refreshStatus, 5000);
        }

        createDeviceController({
            statusDotId: "device-status-dot",
            statusTextId: "device-status-text",
            firmwareBtnId: "btn-update-firmware",
            presetBtnId: "btn-use-preset",
            statusUrl: "/api/device/status/",
            firmwareUrl: "/api/device/update-firmware/",
            presetUrl: "/api/device/use-preset/",
        });

        createDeviceController({
            statusDotId: "data-status-dot",
            statusTextId: "data-status-text",
            firmwareBtnId: "btn-data-update-firmware",
            presetBtnId: "btn-data-use-preset",
            statusUrl: "/api/data/status/",
            firmwareUrl: "/api/data/update-firmware/",
            presetUrl: "/api/data/use-preset/",
        });
    </script>
</body>
</html>
